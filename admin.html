  <main class="page-main beats-main admin-beats-main">
    <section class="admin-panel" aria-labelledby="newBeatTitle">
      <h1 class="beats-heading" id="newBeatTitle">Novo Beat</h1>

      <div class="admin-editor">
        <aside class="admin-preview" aria-label="Pr&eacute;via do beat">
          <article class="beat-card admin-preview-card">
            <div class="admin-cover-drop" id="beatCoverDrop" tabindex="0" role="button" aria-label="Enviar capa ou GIF do beat">
              <input id="beatCoverFile" name="coverFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
              <img id="adminPreviewCover" class="beat-cover admin-cover-drop__image" src="" alt="Pr&eacute;via da capa ou GIF do beat" hidden />
              <div id="adminPreviewPlaceholder" class="admin-cover-drop__placeholder">
                <span>Capa/GIF</span>
                <strong>Arraste ou selecione</strong>
              </div>
              <div class="admin-cover-drop__overlay">Solte imagem ou GIF</div>
            </div>
            <div class="beat-info">
              <h3 id="adminPreviewTitle" class="beat-title"></h3>
              <p id="adminPreviewMeta" class="beat-meta"></p>
              <div class="admin-preview-tags" id="adminPreviewTags" aria-label="Tags selecionadas"></div>
            </div>
            <div class="admin-audio-preview">
              <audio id="adminPreviewAudio" src="assets/audio/xxx.mpeg" controls preload="metadata" hidden></audio>
            </div>
          </article>
        </aside>

        <div class="admin-compose">
          <form class="admin-form" id="beatAdminForm">
            <input id="beatCover" name="cover" type="hidden" required />
            <input id="beatAudio" name="audio" type="hidden" />
            <input id="beatWav" name="wav" type="hidden" />
            <input id="beatStems" name="stems" type="hidden" />

            <div class="admin-form__row admin-form__row--identity">
              <div class="field">
                <label for="beatTitle">Nome</label>
                <input id="beatTitle" name="title" type="text" placeholder="Wake Up" required />
              </div>

              <div class="field">
                <label for="beatBpm">BPM</label>
                <input id="beatBpm" name="bpm" type="number" min="1" placeholder="144" required />
              </div>

              <div class="field">
                <label for="beatKey">Tom <span class="field-help" title="Tonalidade musical do beat. Ex: F#m, Bm, Cm.">?</span></label>
                <input id="beatKey" name="key" type="text" placeholder="F#m" required />
              </div>
            </div>

            <div class="admin-form__row admin-form__row--files file-panel" aria-label="Arquivos do beat">
              <div class="field file-field">
                <div class="file-field__head">
                  <span class="file-field__title">MP3</span>
                  <label class="license-toggle">
                    <input id="enableMp3License" class="license-toggle__input" type="checkbox" checked />
                    <span class="license-toggle__control" aria-hidden="true"></span>
                    <span class="license-toggle__text">Dispon&iacute;vel</span>
                  </label>
                </div>
                <input id="beatMp3File" name="mp3File" type="file" accept="audio/mpeg,audio/mp3,.mp3" />
                <label class="file-upload" for="beatMp3File">
                  <span class="file-upload__check" aria-hidden="true">&check;</span>
                  <span class="file-upload__format">MP3</span>
                  <span class="file-upload__body">
                    <span class="file-upload__text" data-default="MP3 pendente">MP3 pendente</span>
                    <span class="file-upload__hint">Preview da loja</span>
                  </span>
                </label>
                <div class="file-preview file-preview--audio" id="mp3FilePreview" hidden>
                  <button class="file-preview__play" id="mp3FilePlay" type="button" aria-label="Tocar MP3">&#9654;</button>
                  <span class="file-preview__wave" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                  </span>
                  <audio id="mp3FilePlayer" preload="metadata"></audio>
                </div>
              </div>

              <div class="field file-field">
                <div class="file-field__head">
                  <span class="file-field__title">WAV</span>
                  <label class="license-toggle">
                    <input id="enableWavLicense" class="license-toggle__input" type="checkbox" checked />
                    <span class="license-toggle__control" aria-hidden="true"></span>
                    <span class="license-toggle__text">Dispon&iacute;vel</span>
                  </label>
                </div>
                <input id="beatWavFile" name="wavFile" type="file" accept="audio/wav,.wav" />
                <label class="file-upload" for="beatWavFile">
                  <span class="file-upload__check" aria-hidden="true">&check;</span>
                  <span class="file-upload__format">WAV</span>
                  <span class="file-upload__body">
                    <span class="file-upload__text" data-default="WAV pendente">WAV pendente</span>
                    <span class="file-upload__hint">Arquivo de alta qualidade</span>
                  </span>

                <div class="file-preview file-preview--audio" id="wavFilePreview" hidden>
                  <button class="file-preview__play" id="wavFilePlay" type="button" aria-label="Tocar WAV">&#9654;</button>
                  <span class="file-preview__wave" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                  </span>
                  <audio id="wavFilePlayer" preload="metadata"></audio>
                </div>
              </div>

              <div class="field file-field">
                <div class="file-field__head">
                  <span class="file-field__title">Stems ZIP <span class="field-help" title="Arquivo .zip com as faixas separadas do beat.">?</span></span>
                  <label class="license-toggle">
                    <input id="enableStemsLicense" class="license-toggle__input" type="checkbox" checked />
                    <span class="license-toggle__control" aria-hidden="true"></span>
                    <span class="license-toggle__text">Dispon&iacute;vel</span>
                  </label>
                </div>
                <input id="beatStemsFile" name="stemsFile" type="file" accept=".zip,application/zip,application/x-zip-compressed" />

                  <span class="file-upload__check" aria-hidden="true">&check;</span>
                  <span class="file-upload__format">ZIP</span>
                  <span class="file-upload__body">
                    <span class="file-upload__text" data-default="ZIP pendente">ZIP pendente</span>
                    <span class="file-upload__hint">Stems separadas</span>

                  <span class="file-preview__folder" aria-hidden="true">Pasta ZIP</span>
                  <span class="file-preview__zip-meta" id="stemsFileMeta"></span>
                </div>
              </div>
            </div>
