<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beat | JPG Sounds</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem("jpg_theme") === "dark") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch (_error) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <nav class="nav" aria-label="Navega&ccedil;&atilde;o principal">
    <a class="brand" href="index.html" aria-label="Ir para o in&iacute;cio">JPG</a>
    <div class="nav-center" aria-label="Links principais">
      <a class="center-link" href="beats.html">Beats</a>
      <a class="center-link" href="licenses.html">Licen&ccedil;as</a>
      <a class="center-link" href="contact.html">Contato</a>
    </div>

    <div class="actions" role="group" aria-label="A&ccedil;&otilde;es">
      <button class="icon-btn" id="searchButton" aria-label="Buscar">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6" />
          <path d="M20 20l-4.2-4.2" />
        </svg>
      </button>

      <div class="user-menu">
        <button class="icon-btn" id="userMenuButton" aria-label="Perfil" aria-haspopup="true" aria-expanded="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" />
            <path d="M6 19a6 6 0 0 1 12 0" />
          </svg>
        </button>
        <div class="user-dropdown" id="userDropdown"></div>
      </div>

      <form class="search-form" id="searchForm" role="search" action="#" method="get">
        <input id="searchInput" class="search-input" type="search" name="q" placeholder="Pesquisar..." autocomplete="off" />
      </form>
    </div>
  </nav>

  <main class="page-main beat-view-main">
    <section class="beat-view" aria-label="Detalhes do beat">
      <div class="beat-view-left">
        <img id="beatViewCover" class="beat-view-cover" src="" alt="" />
        <h1 id="beatViewTitle" class="beat-view-title"></h1>
        <p id="beatViewMeta" class="beat-view-meta"></p>
      </div>

      <div class="beat-view-right">
        <div class="beat-view-license-row" aria-label="Licen&ccedil;as">
          <button type="button" class="beat-view-license-btn" data-license="mp3">
            <span>MP3</span>
            <strong>R$120</strong>
            <small>Ideal para lan&ccedil;amentos</small>
          </button>
          <button type="button" class="beat-view-license-btn" data-license="wav">
            <span>WAV</span>
            <strong>R$150</strong>
            <small>Qualidade m&aacute;xima</small>
          </button>
          <button type="button" class="beat-view-license-btn" data-license="stems">
            <span>STEMS</span>
            <strong>R$400</strong>
            <small>Controle total da mix</small>
          </button>
          <button type="button" class="beat-view-license-btn" data-license="exclusiva">
            <span>EXCLUSIVA</span>
            <strong>A negociar</strong>
            <small>Beat removido da loja</small>
          </button>
        </div>

        <p id="beatViewPrice" class="beat-view-price"></p>
        <article class="beat-view-license-detail" aria-live="polite">
          <p id="beatViewLicenseHint" class="beat-view-hint"></p>
          <ul id="beatViewLicenseFeatures" class="beat-view-license-features"></ul>
        </article>

        <div class="beat-view-actions">
          <button type="button" id="beatViewAddCart" class="beat-view-btn">Comprar licen&ccedil;a</button>
        </div>

        <p id="beatViewFeedback" class="beat-view-feedback" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer" aria-label="Rodap&eacute; do site">
    <p class="site-footer__brand">JPG Sounds</p>
    <div class="site-footer__links">
      <a href="https://www.instagram.com/jpgoncalvezz" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="https://www.youtube.com/@jpgoncalvezz" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a href="contact.html" data-contact-trigger>Contato</a>
    </div>
  </footer>

  <script src="assets/js/global-player.js"></script>
  <script src="assets/js/beats-data.js"></script>
  <script src="assets/js/beats-store.js"></script>
  <script src="assets/js/beat-detail.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/contact-modal.js"></script>
  <script src="assets/js/contracts.js"></script>
  <script src="assets/js/index.js"></script>
</body>
</html>
